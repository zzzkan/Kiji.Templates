name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      package-artifact:
        description: Existing package artifact to verify; pack locally when omitted.
        required: false
        type: string
        default: ''

concurrency:
  # A called workflow inherits its caller's name; keep this group distinct from Release.
  group: ${{ github.workflow }}-verify-${{ github.ref }}
  cancel-in-progress: ${{ inputs.package-artifact == '' }}

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_HOME: ${{ github.workspace }}/artifacts/verification/cli
      NUGET_PACKAGES: ${{ github.workspace }}/artifacts/verification/packages
      DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: '0'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: '0'
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/artifacts/verification/browsers
      KIJI_VERIFICATION_DIRECTORY: ${{ github.workspace }}/artifacts/verification
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # MinVer uses Git tags to determine the package version.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Download existing package
        if: inputs.package-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.package-artifact }}
          path: artifacts/packages
      - name: Pack
        if: inputs.package-artifact == ''
        run: dotnet pack Kiji.Templates.csproj -c Release -o artifacts/packages
      - name: Select package
        run: |
          $packages = @(Get-ChildItem artifacts/packages/*.nupkg)
          if ($packages.Count -ne 1) {
            throw "Expected one template package, found $($packages.Count)."
          }
          "TEMPLATE_PACKAGE=$($packages[0].FullName)" >> $env:GITHUB_ENV
      - name: Restore Authoring CLI
        run: dotnet tool restore
      - name: Verify packaged templates and publish generated sites
        run: ./.github/scripts/verify-templates.ps1 -Package $env:TEMPLATE_PACKAGE -RunDirectory artifacts/verification/sites
      - name: Install browser checks
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet build tests/Kiji.Templates.BrowserTests -c Release
          pwsh ./tests/Kiji.Templates.BrowserTests/bin/Release/net10.0/playwright.ps1 install --with-deps --only-shell chromium
      - name: Check browser behavior at root and deployment path
        run: dotnet test tests/Kiji.Templates.BrowserTests -c Release --no-build --logger trx --results-directory artifacts/verification/logs
      - name: Upload verification diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ matrix.os }}
          path: |
            tests/snapshots/*.received/**
            artifacts/verification/logs/**
            artifacts/verification/sites/logs/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
