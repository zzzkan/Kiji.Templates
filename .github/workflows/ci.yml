name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      package-artifact:
        description: Existing package artifact to verify; pack locally when omitted.
        required: false
        type: string
        default: ''

concurrency:
  # A called workflow inherits its caller's name; keep this group distinct from Release.
  group: ${{ github.workflow }}-verify-${{ github.ref }}
  cancel-in-progress: ${{ inputs.package-artifact == '' }}

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_HOME: ${{ github.workspace }}/artifacts/verification/cli
      NUGET_PACKAGES: ${{ github.workspace }}/artifacts/verification/packages
      DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: '0'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: '0'
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/artifacts/verification/browsers
      KIJI_VERIFICATION_DIRECTORY: ${{ github.workspace }}/artifacts/verification
      KIJI_TEMPLATE_PACKAGE: ${{ github.workspace }}/artifacts/packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # MinVer uses Git tags to determine the package version.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Download existing package
        if: inputs.package-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.package-artifact }}
          path: artifacts/packages
      - name: Pack
        if: inputs.package-artifact == ''
        run: dotnet pack src/Kiji.Templates/Kiji.Templates.csproj -c Release -o artifacts/packages
      - name: Build tests
        run: dotnet build src/Kiji.Templates.Tests -c Release
      - name: Install Chromium
        run: pwsh ./src/Kiji.Templates.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps --only-shell chromium
      - name: Verify package and generated sites
        run: dotnet test src/Kiji.Templates.Tests -c Release --no-build --logger trx --results-directory artifacts/verification/logs
      - name: Upload verification diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ matrix.os }}
          path: |
            artifacts/verification/**/logs/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
