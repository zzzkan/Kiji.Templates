name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # MinVer uses Git tags to determine the package version.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Pack
        run: dotnet pack src/Kiji.Templates/Kiji.Templates.csproj -c Release
      - name: Build tests
        run: dotnet build src/Kiji.Templates.Tests -c Release
      - name: Install Chromium
        if: runner.os == 'Linux'
        run: pwsh ./src/Kiji.Templates.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps --only-shell chromium
      - name: Report preinstalled Edge version
        if: runner.os == 'Windows'
        run: (Get-Item "${env:ProgramFiles(x86)}/Microsoft/Edge/Application/msedge.exe").VersionInfo.ProductVersion
      - name: Verify package and generated sites
        env:
          KIJI_TEST_BROWSER_CHANNEL: ${{ runner.os == 'Windows' && 'msedge' || '' }}
        run: >-
          dotnet test --project src/Kiji.Templates.Tests -c Release --no-build
          --report-xunit-trx
      - name: Upload verification diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ matrix.os }}
          path: |
            TestResults/*.trx
            TestResults/**/logs/**
          if-no-files-found: ignore
          retention-days: 7
