name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # MinVer uses Git tags to determine the package version.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Pack
        run: dotnet pack src/Kiji.Templates/Kiji.Templates.csproj -c Release
      - name: Build tests
        run: dotnet build src/Kiji.Templates.Tests -c Release
      - name: Install Chromium
        run: pwsh ./src/Kiji.Templates.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps --only-shell chromium
      - name: Verify package and generated sites
        run: >-
          dotnet test --project src/Kiji.Templates.Tests -c Release --no-build
          --report-xunit-trx
      - name: Upload verification diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification
          path: |
            TestResults/*.trx
            TestResults/**/logs/**
          if-no-files-found: ignore
          retention-days: 7
