version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /content/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
